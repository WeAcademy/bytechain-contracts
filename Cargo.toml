[workspace]
resolver = "2"
members = ["contracts/hello-world"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/WeAcademy/bytechain-contracts"
authors = ["ByteChain Academy contributors"]

[workspace.dependencies]
soroban-sdk = "29.0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
